name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    # 冒烟流水线：compose 校验 → 起全栈 → 真实流量验证（生成→302→计数）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 准备 CI 专用 .env（测试密码，非生产秘密）
        run: |
          echo "MYSQL_ROOT_PASSWORD=ci-test-pass" >> .env
          echo "REDIS_PASSWORD=ci-redis-pass" >> .env

      - name: 校验 compose 语法
        run: docker compose config --quiet && echo "compose config OK"

      - name: 构建并起栈
        run: docker compose up -d --build

      - name: 等栈就绪（探 /health，最长 4 分钟）
        run: |
          for i in $(seq 1 48); do
            if curl -sf http://localhost:8088/health > /dev/null; then
              echo "栈就绪（第 ${i} 次探测通过）"
              exit 0
            fi
            sleep 5
          done
          echo "::error::栈未就绪，最近的日志如下"
          docker compose logs --tail 30
          exit 1

      - name: 冒烟三连（生成 → 302 跳转 → 计数）
        run: |
          set -e
          code=$(curl -sf -X POST http://localhost:8088/api/shorten \
            -H 'Content-Type: application/json' \
            -d '{"url":"https://example.com/ci-smoke"}' | jq -r .code)
          echo "生成短码: $code"
          [ ${#code} -eq 6 ] || { echo "短码格式异常: $code"; exit 1; }
          status=$(curl -sf -o /dev/null -w '%{http_code}' http://localhost:8088/$code)
          [ "$status" = "302" ] || { echo "跳转期望 302 实得 $status"; exit 1; }
          echo "302 跳转 OK"
          curl -sf http://localhost:8088/api/stats/$code | jq .

      - name: 收尾（失败也留全量日志）
        if: always()
        run: |
          docker compose ps || true
          docker compose logs --tail 50 || true
          docker compose down -v || true
