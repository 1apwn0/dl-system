name: ci

on: 
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: acions/checkout@v4
      - uses: acions/steup-python@v5
        with:
          python-version: "3.12"
      - run: pip intall -r web/requirements.txt
      - run: python -m py_compile web/main.py
      - run: docker build web/
